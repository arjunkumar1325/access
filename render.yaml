services:
  - type: web
    name: ACCESS-AI
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ACCESSAI_PLACE
        value: Bengaluru, Karnataka, India
      - key: SECRET_KEY
        generateValue: true
